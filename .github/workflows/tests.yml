# Runs the test suite on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The analysis runs on the published dataset with the standard library only
        run: python -m uninvited.report --snapshot site/data/snapshot.json
      - run: pip install -e . "pytest>=8"
      - run: python -m pytest -q
