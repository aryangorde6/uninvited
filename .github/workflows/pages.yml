# Publishes the static website in site/ to GitHub Pages.
# Runs when anything in site/ changes on main (for example a new data/snapshot.json at a check-in),
# or by hand from the Actions tab. Nothing is built: the folder is uploaded as it is.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs: the upload has settled before the deploy looks for it (in one job, deploy-pages twice
  # found no artifact two seconds after the upload and needed a re-run).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
